# 单服务 compose：一个容器同时提供 POST /ask（RAG 基线）与 POST /agent（单 Agent）
#
# 用法：
#   1) 本机先入库：python src/ingest3.py（生成 ./data/chroma）
#   2) copy .env.example .env 并填 SILICONFLOW_API_KEY / DEEPSEEK_API_KEY
#   3) docker compose up --build
#   4) 健康检查：http://127.0.0.1:8000/health
#
# 说明：
# - 密钥通过 env_file 注入，不打进镜像
# - 向量库以只读卷挂载复用，避免容器内重复嵌入（省钱省时）
# - 若不想在宿主机入库，删掉 volumes 那两行，容器首次启动会自动建索引
# - PORT 显式设为 8000，与下面端口映射一致（镜像默认 7860 是为 HF Spaces 准备的）
services:
  api:
    build: .
    image: opengauss-rag:0.1
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CHROMA_DIR: /app/data/chroma
      PORT: "8000"
    volumes:
      - ./data/chroma:/app/data/chroma:ro
    restart: unless-stopped
